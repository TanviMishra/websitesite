<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvi websitesite</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="tanvistyle.css" />
  </head>
  <body>
      <header>
        <div></div>
          <h1>tanvi's websitesite</h1>
          <button class="info">
            <span class="info-icon">i</span>
            <span class="info-tooltip">
              This is an index of websites built by Tanvi. It is based on Jisu's at <a href="https://websitesite.xyz/" target="_blank" rel="noreferrer"
              >websitesite.xyz</a>
            </span>
          </button>
      </header>

      <main>
      <section class="table">
        <table class="sites-table">
          <thead>
            <tr>
              <th scope="col">v.1</th>
              <th scope="col">v.2</th>
              <th scope="col">v.3</th>
              <th scope="col">Title</th>
              <th scope="col">Github</th>
              <th scope="col">Year</th>
              <th scope="col">For</th>
              <th scope="col">Function</th>
              <th scope="col">Description</th>
            </tr>
          </thead>
          <tbody id="sites-tbody"></tbody>
        </table>
      </section>
    </main>

      <footer>
        <p>Last updated: Feb 28, 2026</p>
      </footer>
    <script src="main.js"></script>
  </body>
</html>
